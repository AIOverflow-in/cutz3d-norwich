name: Publish weekly barber guide

on:
  schedule:
    - cron: "15 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run blog:generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_MODEL: gpt-5-mini
      - run: |
          git config user.name "3D Cutz Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog
          git diff --cached --quiet || git commit -m "content: publish weekly barber guide"
          git push
